<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypta Guard | Password Recovery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        margin: -20px 0 50px;
      }
      .container {
        min-height: 480px;
        width: 500px;
        max-width: 90%;
        background: rgba(0, 0, 0, 0.829);
        border: 1px solid #d4af37;
        box-shadow:
          0 14px 28px rgba(0, 0, 0, 0.25),
          0 10px 10px rgba(0, 0, 0, 0.22),
          0 0 15px rgba(212, 175, 55, 0.3);
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        padding: 40px;
      }
      h1 {
        margin-bottom: 20px;
      }
      .input-group {
        width: 100%;
        margin: 10px 0;
      }
      .cyber-btn {
        margin-top: 20px;
      }
      .back-link {
        margin-top: 20px;
        color: #d4af37;
        text-decoration: none;
        font-size: 0.9em;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="cyber-grid"></div>

    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div
        style="
          background: rgba(255, 0, 0, 0.2);
          color: #fff;
          padding: 10px;
          border: 1px solid red;
          margin-bottom: 10px;
          border-radius: 5px;
          width: 100%;
          text-align: center;
        "
      >
        {{ message }}
      </div>
      {% endfor %} {% endif %} {% endwith %}

      <form
        action="{{ url_for('forgot_password') }}"
        method="POST"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          height: 100%;
          justify-content: center;
        "
      >
        <h1>RECOVERY PROTOCOL</h1>
        <span>Enter your registered email to initiate recovery.</span>

        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          />
        </div>

        <button class="cyber-btn">PROCEED</button>
        <a href="{{ url_for('login') }}" class="back-link">Return to Login</a>
      </form>
    </div>
  </body>
</html>
