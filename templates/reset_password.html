<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypta Guard | Reset Password</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        margin: -20px 0 50px;
      }
      .container {
        min-height: 480px;
        width: 500px;
        max-width: 90%;
        background: rgba(0, 0, 0, 0.829);
        border: 1px solid #d4af37;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        border-radius: 10px;
        padding: 40px;
      }
    </style>
  </head>
  <body>
    <div class="cyber-grid"></div>

    <div class="container">
      <form
        action="{{ url_for('reset_password') }}"
        method="POST"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          height: 100%;
          justify-content: center;
        "
      >
        <h1>NEW CREDENTIALS</h1>
        <span>Enter your new password below.</span>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            name="password"
            placeholder="New Password"
            required
          />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
          />
        </div>

        <button class="cyber-btn">RESET PASSWORD</button>
      </form>
    </div>
  </body>
</html>
